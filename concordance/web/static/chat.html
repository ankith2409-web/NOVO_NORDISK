<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concordance — {{MODEL_NAME}}</title>
<style>
  :root {
    --paper: #F1F3F5; --card: #FFFFFF; --ink: #14202B; --ink-2: #37464F;
    --graphite: #5C6B74; --graphite-2: #8896A0; --rule: #D3DBE0;
    --accent: #2C5985; --accent-dim: #DCE8F2; --user-bubble: #2C5985;
    --ok: #2E7D5B; --ok-bg: #E4F3EC; --warn: #9A6B1E; --warn-bg: #FBF0DD;
    --crit: #A33B3B; --crit-bg: #FBE7E7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1417; --card: #171E22; --ink: #E6EDF0; --ink-2: #C2CDD2;
      --graphite: #93A2A9; --graphite-2: #6C7A80; --rule: #2A343A;
      --accent: #6FA8D8; --accent-dim: #1B2C3A; --user-bubble: #2C5985;
      --ok: #5FBE93; --ok-bg: #14261F; --warn: #D7A94E; --warn-bg: #2C2413;
      --crit: #E28080; --crit-bg: #2E1A1A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink-2); font-family: var(--sans);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--rule); background: var(--card);
  }
  header h1 { font-size: 1rem; font-weight: 650; color: var(--ink); margin: 0; }
  header .sub { font-family: var(--mono); font-size: 0.72rem; color: var(--graphite); }
  #stats { display: flex; gap: 1.1rem; font-family: var(--mono); font-size: 0.75rem; color: var(--graphite); }
  #stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

  main { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 70ch; padding: 0.7rem 1rem; border-radius: 10px; line-height: 1.55; font-size: 0.92rem; }
  .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 2px; }
  .row.model .bubble { background: var(--card); border: 1px solid var(--rule); color: var(--ink-2); border-bottom-left-radius: 2px; }
  .row.error .bubble { background: var(--crit-bg); border: 1px solid var(--crit); color: var(--crit); }

  .bubble code { font-family: var(--mono); font-size: 0.85em; background: var(--accent-dim); padding: 0.05em 0.35em; border-radius: 3px; }
  .row.user .bubble code { background: rgba(255,255,255,0.18); }
  .bubble pre { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.8rem; overflow-x: auto; margin: 0.5rem 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { color: var(--ink); }
  .row.user .bubble strong { color: #fff; }
  .bubble ul { margin: 0.4rem 0; padding-left: 1.3rem; }

  .grounding { margin-top: 0.55rem; padding-top: 0.5rem; border-top: 1px dashed var(--rule); font-family: var(--mono); font-size: 0.7rem; color: var(--graphite); }
  .grounding .tag { display: inline-block; padding: 0.05em 0.45em; border-radius: 3px; border: 1px solid currentColor; margin-right: 0.3rem; margin-bottom: 0.2rem; }
  .grounding .tag.ok { color: var(--ok); }
  .grounding .tag.warn { color: var(--warn); }

  #composer { display: flex; gap: 0.6rem; padding: 1rem 1.5rem; border-top: 1px solid var(--rule); background: var(--card); }
  #question { flex: 1; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 0.92rem; font-family: var(--sans); }
  #question:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 0.65rem 1.3rem; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.88rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:not(:disabled):hover { filter: brightness(1.08); }

  .thinking { display: flex; gap: 0.3rem; padding: 0.7rem 1rem; }
  .thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--graphite-2); animation: pulse 1.1s infinite ease-in-out; }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation: none; } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Concordance</h1>
    <div class="sub">{{MODEL_NAME}}</div>
  </div>
  <div id="stats"></div>
</header>

<main id="log">
  <div class="row model">
    <div class="bubble">
      Ask about <strong>{{MODEL_NAME}}</strong> — tables, measures, DAX logic, joins, hierarchies,
      or what would break if something changed. Answers are grounded in the extracted model;
      if something is not in it, that's what I'll say.
    </div>
  </div>
</main>

<form id="composer">
  <input id="question" type="text" placeholder="e.g. How is Serious Adverse Events calculated?" autocomplete="off" autofocus>
  <button id="send" type="submit">Ask</button>
</form>

<script>
(function () {
  const log = document.getElementById('log');
  const form = document.getElementById('composer');
  const input = document.getElementById('question');
  const send = document.getElementById('send');
  const stats = document.getElementById('stats');

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // A small, deliberately limited renderer: escape first, then recognise only
  // the Markdown the model actually produces (fences, bold, inline code,
  // bullets). Escaping first means nothing in the answer can inject HTML.
  function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^\* (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
    html = html.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
  }

  function addRow(role, innerHtml) {
    const row = document.createElement('div');
    row.className = `row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = innerHtml;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'row model';
    row.innerHTML = '<div class="bubble thinking"><span></span><span></span><span></span></div>';
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function groundingHtml(data) {
    const tags = (data.tool_calls || [])
      .map(c => `<span class="tag ok">${escapeHtml(c.name)}(${escapeHtml(Object.values(c.arguments||{}).join(', '))})</span>`)
      .join('');
    const rejected = (data.rejected_calls || [])
      .map(name => `<span class="tag warn">rejected: ${escapeHtml(name)}</span>`)
      .join('');
    if (!tags && !rejected) {
      return '<div class="grounding">answered without consulting the model</div>';
    }
    return `<div class="grounding">${tags}${rejected}</div>`;
  }

  async function loadOverview() {
    try {
      const res = await fetch('/api/overview');
      const data = await res.json();
      stats.innerHTML =
        `<span><b>${data.tables ?? '—'}</b> tables</span>` +
        `<span><b>${data.measures ?? '—'}</b> measures</span>` +
        `<span><b>${data.relationships ?? '—'}</b> joins</span>`;
    } catch (e) {
      // Non-fatal: the header stat strip is a nicety, not a dependency.
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addRow('user', escapeHtml(question));
    input.value = '';
    input.disabled = true;
    send.disabled = true;
    const thinking = addThinking();

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      thinking.remove();

      if (!res.ok) {
        addRow('error', escapeHtml(data.error || `Request failed (${res.status})`));
      } else {
        addRow('model', renderMarkdown(data.answer) + groundingHtml(data));
      }
    } catch (error) {
      thinking.remove();
      addRow('error', 'Could not reach the server. Is it still running?');
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  });

  loadOverview();
})();
</script>
</body>
</html>
