# Build the 36 Months planner into an installable Android package.
#
# The APK is assembled here rather than locally because the Android SDK is the
# one dependency a development container cannot always reach: Google's
# distribution host sits outside most egress policies. GitHub's runners ship
# the SDK, so this is where the compile belongs.
#
# Every run signs with the checked-in sideload key. That key is deliberately
# not a secret -- see apps/thirty-six-months/README.md. It exists so each new
# build installs *over* the previous one instead of being rejected as a
# different app, which is the difference between an update and losing three
# years of logged hours.
name: 36 Months APK

on:
  push:
    paths:
      - "apps/thirty-six-months/**"
      - ".github/workflows/thirty-six-months-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin the SDK pieces the build declares, rather than trusting whatever
      # the runner image happens to carry this month.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The run number becomes the version code, so Android always sees a
      # later build as an upgrade.
      - name: Assemble
        working-directory: apps/thirty-six-months/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Name it something a phone can explain
        id: apk
        working-directory: apps/thirty-six-months/android
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          test -f "$src" || { echo "::error::no APK at $src"; ls -R app/build/outputs || true; exit 1; }
          out="36Months-1.0.${{ github.run_number }}.apk"
          cp "$src" "../$out"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "path=apps/thirty-six-months/$out" >> "$GITHUB_OUTPUT"
          ls -la "../$out"

      # Confirm the thing is actually signed; an unsigned APK installs nowhere
      # and the failure only shows up on the phone.
      - name: Verify the signature
        working-directory: apps/thirty-six-months
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            "${{ steps.apk.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      # A release gives the phone a plain URL to download from -- artifacts
      # are zipped, which Android cannot install.
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="36months-v1.0.${{ github.run_number }}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --title "36 Months 1.0.${{ github.run_number }}" \
            --notes "Sideload build from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`).

          Open this page on your phone and tap the \`.apk\` to install. Android will ask you to allow installs from your browser the first time.

          Installs over any earlier 1.0.x build without touching your data." \
            --target "${{ github.sha }}"
