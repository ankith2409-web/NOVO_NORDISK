[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "0.1.0"
description = "Bi-directional traceability between business requirements and enterprise semantic layers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pbixray>=0.15.4",
    "networkx>=3.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
janus = "janus.cli:main"

[tool.setuptools.packages.find]
include = ["janus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
