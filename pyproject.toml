[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Bi-directional traceability between business requirements and enterprise semantic layers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pbixray>=0.15.4",
    "networkx>=3.0",
    "pandas>=2.0",
    "python-docx>=1.1",
    # Warehouse side: sqlglot parses view definitions into an AST, duckdb is the
    # credential-free stand-in whose information schema matches the one
    # Snowflake and Databricks expose.
    "sqlglot>=25.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for --platform snowflake; the DuckDB path (default) has no
# platform-specific driver at all, and most uses of this project never touch
# a live warehouse.
snowflake = ["snowflake-connector-python>=3.0"]

[project.scripts]
concordance = "concordance.cli:main"

[tool.setuptools.packages.find]
include = ["concordance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
