[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Bi-directional traceability between business requirements and enterprise semantic layers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pbixray>=0.15.4",
    "networkx>=3.0",
    "pandas>=2.0",
    "python-docx>=1.1",
    # Warehouse side: sqlglot parses view definitions into an AST, duckdb is the
    # credential-free stand-in whose information schema matches the one
    # Snowflake and Databricks expose.
    "sqlglot>=25.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for --platform snowflake; the DuckDB path (default) has no
# platform-specific driver at all, and most uses of this project never touch
# a live warehouse.
snowflake = ["snowflake-connector-python>=3.0"]
# The same reasoning for the other three platforms: each is one driver, needed
# only by the matching --platform, and none of them is imported until that
# platform is actually selected. `warehouses` installs all four for anyone who
# would rather not choose.
databricks = ["databricks-sql-connector>=3.0"]
redshift = ["redshift-connector>=2.0"]
athena = ["pyathena>=3.0"]
warehouses = [
    "snowflake-connector-python>=3.0",
    "databricks-sql-connector>=3.0",
    "redshift-connector>=2.0",
    "pyathena>=3.0",
]
# Only needed for --auth0-domain. The `crypto` extra pulls in `cryptography`,
# which is what actually verifies an RS256 signature; PyJWT alone would decode
# the token and check nothing. Declared here rather than relied on
# transitively -- it currently arrives via snowflake-connector-python, and an
# authentication check resting on a dependency of an optional warehouse driver
# is one `pip uninstall` away from silently having nothing behind it.
auth0 = ["pyjwt[crypto]>=2.8"]

[project.scripts]
concordance = "concordance.cli:main"

[tool.setuptools.packages.find]
include = ["concordance*"]

# Setuptools ships only `.py` files by default. Without this, `pip install .`
# (a real, non-editable install -- what a Docker image or a PyPI release both
# do) silently drops `concordance/web/static/*.html`, and `concordance serve`
# then crashes on its first request with a `FileNotFoundError` no test in this
# repo would ever catch, because every test runs against the source tree
# rather than an installed package. Found exactly that way: installing into a
# clean venv to verify a deploy container, which is the whole reason to do it
# rather than trust the Dockerfile by inspection.
[tool.setuptools.package-data]
concordance = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
